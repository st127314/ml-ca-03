name: A3 CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r app/requirements.txt pytest
      - run: pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/car-price-classifier-a3:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/car-price-classifier-a3:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile.mlflow
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/car-price-classifier-a3-mlflow:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/car-price-classifier-a3-mlflow:${{ github.sha }}

  deploy:
    needs: build-and-deploy
    runs-on: [self-hosted, st127314-a3]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest image and redeploy
        run: |
          docker compose -f app/docker-compose.yaml pull
          docker compose -f app/docker-compose.yaml up -d
